<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Habit Streak Keeper</title>
<style>
:root{
  --paper:#fdf2f5;--panel:#ffffff;--ink:#3a1028;--accent:#b1245a;--blush:#f6c6d4;
  --mute:#7d5d6b;--rule:#efd3dc;--miss:#f6e6ec;--future:transparent;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#1d0f17;--panel:#2a1620;--ink:#fde9f0;--accent:#ff7fa8;--blush:#5a2a40;
    --mute:#c9a3b3;--rule:#4a2a38;--miss:#3a1f2b;
  }
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font:16px/1.45 "Century Gothic",Futura,"Avenir Next",sans-serif;padding:16px}
main{max-width:560px;margin:0 auto}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:12px 0 0}
h1{margin:4px 0 0;font-size:clamp(1.7rem,6vw,2.2rem);font-weight:700;letter-spacing:-.01em;line-height:1.15}
.hero{background:var(--accent);color:#fff;border-radius:22px;padding:20px 22px 18px;margin-top:18px}
.hero .big{font-size:4.6rem;line-height:.9;font-weight:700}
.hero .lbl{font-size:.9rem;opacity:.92;margin-top:6px}
.hero .meta{font-size:.82rem;opacity:.8;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.stat{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:1.9rem;line-height:1;color:var(--accent)}
.stat span{font-size:.8rem;color:var(--mute)}
.calendar{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:14px;margin-top:12px}
.calendar h2{margin:0 0 10px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:.72rem;color:var(--mute);margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.c{aspect-ratio:1;border-radius:50%;background:var(--miss)}
.c.done{background:var(--accent)}
.c.future{background:var(--future);border:1.5px dashed var(--rule)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--mute);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.note{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--blush);color:var(--ink);font-size:.95rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Habit</p>
  <h1 id="h"></h1>

  <section class="hero" aria-label="Current streak">
    <div class="big" id="cur">–</div>
    <div class="lbl">check-ins in a row</div>
    <div class="meta" id="sub"></div>
  </section>

  <section class="stats" aria-label="Streak numbers" id="nums"></section>

  <section class="calendar" aria-label="Last nine weeks">
    <h2>Last nine weeks</h2>
    <div class="wk" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>checked in</span>
      <span><i style="background:var(--miss)"></i>missed</span>
      <span><i style="border:1.5px dashed var(--rule)"></i>upcoming</span>
    </div>
  </section>

  <p class="note" id="note"></p>
</main>
<script>
(async () => {
  const s = await (await fetch("/sample")).json();
  const r = await (await fetch("/streak", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({done: s.done, today: s.today, grace_days: s.grace_days}),
  })).json();
  document.getElementById("h").textContent = s.habit;
  document.getElementById("cur").textContent = r.streak.current;
  document.getElementById("sub").textContent = `${r.streak.total_checkins} check-ins in total · ${s.grace_days} missed day allowed`;
  const n = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  document.getElementById("nums").innerHTML = n(r.streak.longest, "longest streak") + n(r.strict.current, "strict current, no grace");
  document.getElementById("grid").innerHTML = r.heatmap.flat().map(c => `<div class="c ${c}"></div>`).join("");
  document.getElementById("note").textContent = `With no grace day one slip resets the current streak to ${r.strict.current}; with one grace day it stays ${r.streak.current}.`;
})();
</script>
</body>
</html>
