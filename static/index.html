<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aisle Walk</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2f8f6;--panel:#ffffff;--ink:#173034;--mute:#5f7478;--rule:#cfe0dc;
  --plum:#8b3a8f;--mint:#2fa58c;--shelf:#dfeee9;--tick:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0e1d20;--panel:#152a2e;--ink:#e4f2ef;--mute:#93aeab;--rule:#27444a;
    --plum:#d18ad6;--mint:#5fd3b8;--shelf:#1e3a40;--tick:#0e1d20;
  }
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font:16px/1.5 "Space Grotesk",system-ui,sans-serif;padding:16px}
main{max-width:1000px;margin:0 auto}
header{padding:8px 0 14px}
h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1;margin:0;font-weight:700;letter-spacing:-.02em}
h1 span{color:var(--plum)}
.sub{color:var(--mute);margin:8px 0 0;max-width:60ch}
h2{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
section{margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:2rem;line-height:1.1;color:var(--plum);font-weight:700}
.tile span{font-size:.82rem;color:var(--mute)}
.mapbox{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:10px}
svg{width:100%;height:auto;display:block}
.walk{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
ol{margin:0;padding-left:1.4em;columns:2;column-gap:24px;font-size:.95rem}
@media (max-width:560px){ol{columns:1}}
li{break-inside:avoid;padding:2px 0}li small{display:block;color:var(--mute);font-size:.82rem}
.empty{color:var(--mute);margin:0;font-size:.95rem}
.aisles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.aisle{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--mint);border-radius:10px;padding:10px 12px}
.aisle h3{margin:0 0 4px;font-size:.92rem;font-weight:500;color:var(--mute)}
label.pick{display:flex;align-items:center;gap:8px;min-height:32px;font-size:.95rem;cursor:pointer}
input[type=checkbox]{accent-color:var(--plum);width:18px;height:18px;margin:0}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Aisle <span>Walk</span></h1>
    <p class="sub">Tick your list in any order. The planner finds the shortest walk through the shop, not the zig-zag you would make by memory.</p>
  </header>

  <section aria-label="Route summary">
    <div class="stats" id="st" aria-live="polite"></div>
  </section>

  <section aria-label="Store map">
    <div class="mapbox"><svg id="m" viewBox="0 0 640 330" role="img" aria-label="Store map with route"></svg></div>
  </section>

  <section aria-label="Walk order">
    <h2>Walk order</h2>
    <div class="walk"><ol id="o"></ol><p class="empty" id="none" hidden>Tick something to plan a walk.</p></div>
  </section>

  <section aria-label="Shopping list">
    <h2>Your list, by aisle</h2>
    <div class="aisles" id="l"></div>
  </section>
</main>
<script>
const $ = i => document.getElementById(i);
let store;
const picked = ["milk","apples","pasta","water","bread","tuna","crisps","dish soap","eggs","rice"];
const X = a => 50 + a * (540 / 7), Y = d => 40 + d * 24;
const pos = (a, d) => [X(a), Y(d)];

function sync(e) {
  const i = picked.indexOf(e.target.value);
  if (e.target.checked && i < 0) picked.push(e.target.value);
  if (!e.target.checked && i >= 0) picked.splice(i, 1);
  go();
}

async function go() {
  const items = picked.slice();
  if (!items.length) {
    $("st").innerHTML = ""; $("o").innerHTML = ""; $("none").hidden = false; draw([], []);
    return;
  }
  $("none").hidden = true;
  const d = await (await fetch("/route", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({items})})).json();
  $("st").innerHTML = `<div class="tile"><b>${d.length}</b><span>steps, best order</span></div>`
    + `<div class="tile"><b>${d.list_order_length}</b><span>steps, tick order</span></div>`
    + `<div class="tile"><b>${Math.round((1 - d.length / d.list_order_length) * 100)}%</b><span>less walking</span></div>`;
  $("o").innerHTML = d.steps.map(s => `<li>${s.item}<small>${s.aisle_name} · ${s.leg} steps</small></li>`).join("");
  draw(d.steps, items);
}

function draw(steps, items) {
  let g = "";
  for (let a = 0; a < store.aisles; a++) {
    g += `<rect x="${X(a) - 9}" y="${Y(0)}" width="18" height="${Y(store.depth) - Y(0)}" rx="3" style="fill:var(--shelf);stroke:var(--rule)"/>`
       + `<text x="${X(a)}" y="16" font-size="15" text-anchor="middle" style="fill:var(--mute)">${store.aisle_names[a].split(" ")[0]}</text>`;
  }
  g += `<text x="12" y="${Y(0) - 6}" font-size="14" style="fill:var(--mute)">front</text>`
     + `<text x="12" y="${Y(store.depth) + 16}" font-size="14" style="fill:var(--mute)">back</text>`;

  const route = [];
  let cur = [0, 0];
  for (const s of steps) { const nxt = [s.aisle, s.depth]; route.push(cur, nxt); cur = nxt; }
  let p = "";
  for (let i = 0; i < route.length; i += 2) {
    const [a1, d1] = route[i], [a2, d2] = route[i + 1];
    const [x1, y1] = pos(a1, d1), [x2, y2] = pos(a2, d2);
    if (a1 === a2) p += `M${x1},${y1}L${x2},${y2}`;
    else {
      const front = d1 + d2 <= (2 * store.depth - d1 - d2);
      const cy = front ? Y(0) - 8 : Y(store.depth) + 8;
      p += `M${x1},${y1}L${x1},${cy}L${x2},${cy}L${x2},${y2}`;
    }
  }
  g += `<path d="${p}" fill="none" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 5" style="stroke:var(--plum)"/>`;
  steps.forEach((s, i) => {
    if (s.item === "Checkout") return;
    const [x, y] = pos(s.aisle, s.depth);
    g += `<circle cx="${x}" cy="${y}" r="11" style="fill:var(--plum)"/>`
       + `<text x="${x}" y="${y + 5}" font-size="14" font-weight="700" text-anchor="middle" style="fill:var(--tick)">${i + 1}</text>`;
  });
  g += `<text x="${X(0)}" y="${Y(store.depth) + 30}" font-size="14" font-weight="700" text-anchor="middle" style="fill:var(--mint)">IN</text>`
     + `<text x="${X(store.aisles - 1)}" y="${Y(store.depth) + 30}" font-size="14" font-weight="700" text-anchor="middle" style="fill:var(--mint)">CHECKOUT</text>`;
  $("m").innerHTML = g;
}

(async () => {
  store = await (await fetch("/store")).json();
  $("l").innerHTML = store.aisle_names.map((n, a) =>
    `<div class="aisle"><h3>${n}</h3>`
    + Object.entries(store.items).filter(([k, v]) => v[0] === a).map(([k]) =>
        `<label class="pick"><input type="checkbox" value="${k}" ${picked.includes(k) ? "checked" : ""}>${k}</label>`).join("")
    + `</div>`).join("");
  document.querySelectorAll("#l input").forEach(e => e.onchange = sync);
  go();
})();
</script>
</body>
</html>
