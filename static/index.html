<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hall Booking Optimizer</title>
<style>
:root{
  --bg:#e3e8ef;--panel:#f8fafc;--ink:#14233a;--mute:#55667c;--rule:#c5cfdc;
  --navy:#1f3b63;--gold:#e9a21b;--decline:#b8c2d1;--gold-ink:#14233a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220;--panel:#131d2f;--ink:#e2e9f5;--mute:#97a6bb;--rule:#263450;
    --navy:#6d93d1;--gold:#f5be4b;--decline:#33415a;--gold-ink:#0b1220;
  }
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:15px/1.5 "Franklin Gothic Medium","Arial Narrow",Arial,sans-serif;padding:16px}
main{max-width:1080px;margin:0 auto}
header{padding:8px 0 4px}
h1{margin:0;font-size:clamp(1.9rem,6vw,2.6rem);font-weight:400;letter-spacing:.01em}
.sub{margin:6px 0 0;color:var(--mute);max-width:70ch}
.key{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 4px;font-size:.85rem;color:var(--mute)}
.key i{display:inline-block;width:16px;height:12px;vertical-align:-1px;margin-right:6px;border-radius:2px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px;align-items:start}
@media (max-width:820px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:14px 14px 10px;min-width:0}
.card.best{border:2px solid var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.badge{display:inline-block;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;background:var(--gold);color:var(--gold-ink);padding:2px 8px;border-radius:999px;margin-bottom:6px}
.card h2{margin:0;font-size:1.05rem;font-weight:400}
.nums{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:8px 0 10px;flex-wrap:wrap}
.money{font-size:2rem;font-weight:700;letter-spacing:-.01em}
.meta{font-size:.85rem;color:var(--mute)}
.tl{position:relative;border-bottom:1px solid var(--rule);margin-top:6px}
.bk{position:absolute;height:24px;border-radius:4px;font-size:.7rem;line-height:22px;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:1px solid transparent}
.bk.y{background:var(--navy);color:#fff}
.bk.n{background:repeating-linear-gradient(135deg,var(--decline) 0 4px,transparent 4px 8px);color:var(--mute);border:1px dashed var(--decline)}
.ax{position:relative;height:16px;font-size:.68rem;color:var(--mute);margin-top:4px}
.ax span{position:absolute;transform:translateX(-50%)}
.ax span:first-child{transform:none}
.ax span:last-child{transform:translateX(-100%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Hall booking</h1>
    <p class="sub">Eleven requests for one Saturday in the village hall. Compare three ways of choosing who gets the room.</p>
  </header>
  <div class="key" aria-hidden="true">
    <span><i style="background:var(--navy)"></i>accepted</span>
    <span><i style="background:repeating-linear-gradient(135deg,var(--decline) 0 3px,transparent 3px 6px)"></i>turned away</span>
  </div>
  <div class="cards" id="l" aria-live="polite"></div>
</main>
<script>
const $ = i => document.getElementById(i);
const S = 9 * 60, E = 21 * 60;
const mn = t => { const [h, m] = t.split(":"); return +h * 60 + +m; };
const X = m => (m - S) / (E - S) * 100;

(async () => {
  const d = await (await fetch("/sample")).json();
  const r = await (await fetch("/book", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(d),
  })).json();
  const L = [
    ["first_come", "First come, first served"],
    ["earliest_finish", "Most bookings (earliest finish)"],
    ["best", "Best combination"],
  ];
  $("l").innerHTML = L.map(([k, t]) => {
    const x = r[k], ok = new Set(x.accepted);
    const rows = [];
    const bars = d.requests.map(q => {
      const a = mn(q.start), b = mn(q.end);
      let row = 0;
      while (rows[row] !== undefined && rows[row] > a) row++;
      rows[row] = b;
      return `<div class="bk ${ok.has(q.name) ? "y" : "n"}" style="left:${X(a)}%;width:${X(b) - X(a)}%;top:${row * 28 + 2}px" title="${q.name} $${q.fee}">${q.name}</div>`;
    }).join("");
    const best = k === "best" ? ' best' : '';
    const badge = k === "best" ? '<span class="badge">Highest fees</span><br>' : '';
    return `<article class="card${best}">`
      + `${badge}<h2>${t}</h2>`
      + `<div class="nums"><span class="money">$${x.revenue}</span><span class="meta">${x.bookings} bookings · ${x.hours} h</span></div>`
      + `<div class="tl" style="height:${Math.max(rows.length, 1) * 28 + 6}px">${bars}</div>`
      + `<div class="ax">${[9, 12, 15, 18, 21].map(h => `<span style="left:${X(h * 60)}%">${h}:00</span>`).join("")}</div>`
      + `</article>`;
  }).join("");
})();
</script>
</body>
</html>
