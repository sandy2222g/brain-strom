<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Receipt Line Reader</title>
<style>
:root{--bg:#18201b;--panel:#213027;--slip:#f6f7f2;--slip-ink:#1f2a24;--ink:#e8f1ea;--accent:#a3e635;--warn:#ff7a59;--ok:#7ee787;--mute:#93a598;--line:#30443a;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#e9efe9;--panel:#ffffff;--slip:#fbfcf8;--slip-ink:#1f2a24;--ink:#1f2a24;--accent:#4d7c0f;--warn:#c2410c;--ok:#2f7d3a;--mute:#5d6e62;--line:#cdd9ce;color-scheme:light}}
:root[data-theme="light"]{--bg:#e9efe9;--panel:#ffffff;--slip:#fbfcf8;--slip-ink:#1f2a24;--ink:#1f2a24;--accent:#4d7c0f;--warn:#c2410c;--ok:#2f7d3a;--mute:#5d6e62;--line:#cdd9ce;color-scheme:light}
:root[data-theme="dark"]{--bg:#18201b;--panel:#213027;--slip:#f6f7f2;--slip-ink:#1f2a24;--ink:#e8f1ea;--accent:#a3e635;--warn:#ff7a59;--ok:#7ee787;--mute:#93a598;--line:#30443a;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif;padding:26px 16px 40px}
main{max-width:1000px;margin:0 auto}
h1{font:700 1.6rem "Cascadia Code","Cascadia Mono",Consolas,monospace;margin:0;letter-spacing:.02em;color:var(--accent)}
p.s{color:var(--mute);margin:6px 0 18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{font:13px "Cascadia Code","Cascadia Mono",monospace;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.tabs button.on{background:var(--accent);color:#14200a;border-color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1.05fr;gap:18px;align-items:start}
@media(max-width:780px){.grid{grid-template-columns:1fr}}
textarea{width:100%;height:340px;font:13.5px/1.5 "Cascadia Code","Cascadia Mono",monospace;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:16px;resize:vertical}
.slip{background:var(--slip);color:var(--slip-ink);padding:20px 22px 30px;position:relative;box-shadow:0 10px 22px #0005;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),96% 100%,92% calc(100% - 12px),88% 100%,84% calc(100% - 12px),80% 100%,76% calc(100% - 12px),72% 100%,68% calc(100% - 12px),64% 100%,60% calc(100% - 12px),56% 100%,52% calc(100% - 12px),48% 100%,44% calc(100% - 12px),40% 100%,36% calc(100% - 12px),32% 100%,28% calc(100% - 12px),24% 100%,20% calc(100% - 12px),16% 100%,12% calc(100% - 12px),8% 100%,4% calc(100% - 12px),0 100%)}
.slip h2{margin:0 0 8px;font:700 13px "Cascadia Code","Cascadia Mono",monospace;text-transform:uppercase;letter-spacing:.12em;color:#4d7c0f}
table{width:100%;border-collapse:collapse;font:14px "Cascadia Code","Cascadia Mono",monospace}
td,th{padding:5px 6px;border-bottom:1px dashed #c9d2c8;text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#5d6e62}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.sum td{font-weight:700;border-top:2px solid var(--slip-ink);border-bottom:0}
.flag{margin-top:14px;padding:10px 12px;border-radius:6px;font-size:14px}
.flag.bad{background:#fde7dc;color:#9a2f08;border-left:4px solid #c2410c}
.flag.good{background:#e3f5e6;color:#1f5a28;border-left:4px solid #2f7d3a}
.m{font-size:13px;color:var(--mute);margin-top:16px}.m b{color:var(--ink)}
</style></head><body><main>
<h1>RECEIPT LINE READER</h1><p class="s">Paste receipt text. It extracts the items, then checks the maths.</p>
<div class="tabs" id="tabs"></div>
<div class="grid"><textarea id="tx" spellcheck="false"></textarea>
<div class="slip"><h2>Parsed items</h2><table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Line total</th></tr></thead><tbody id="rows"></tbody></table><div id="fl"></div></div></div>
<p class="m" id="ev"></p></main>
<script>
const $=i=>document.getElementById(i);let tm;const $$=c=>(c/100).toFixed(2);
const LAB={items_sum_mismatch:'The items do not add up to the printed subtotal.',total_mismatch:'Subtotal + tax + tip does not equal the printed total.'};
async function go(){const r=await fetch('/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('tx').value})});
if(!r.ok){$('rows').innerHTML='';$('fl').innerHTML='';return}const j=await r.json(),t=j.totals;
let h=j.items.map(i=>`<tr><td>${i.name.replace(/</g,'&lt;')}</td><td class="n">${i.qty}</td><td class="n">${$$(i.total_cents)}</td></tr>`).join('');
const row=(l,v)=>v==null?'':`<tr class="sum"><td colspan="2">${l}</td><td class="n">${$$(v)}</td></tr>`;
h+=row('Subtotal',t.subtotal)+(t.tax?row('Tax',t.tax).replace(' class="sum"',''):'')+(t.tip?row('Tip',t.tip).replace(' class="sum"',''):'')+row('Total',t.total);$('rows').innerHTML=h;
$('fl').innerHTML=j.issues.length?j.issues.map(i=>`<div class="flag bad">&#9888; ${LAB[i]}</div>`).join(''):'<div class="flag good">&#10003; Arithmetic checks out.</div>'}
fetch('/samples').then(r=>r.json()).then(d=>{const S=d.samples;$('tabs').innerHTML=S.map((s,i)=>`<button data-i="${i}">Receipt ${s.id}</button>`).join('');
const pick=i=>{$('tx').value=S[i].text;[...$('tabs').children].forEach((b,k)=>b.classList.toggle('on',k===i));go()};$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)pick(+b.dataset.i)};pick(3)});
$('tx').oninput=()=>{clearTimeout(tm);tm=setTimeout(go,200)};
fetch('/evaluation').then(r=>r.json()).then(e=>{$('ev').innerHTML=`On ${e.items} items in ${e.receipts} sample receipts: this parser <b>${Math.round(e.parser_accuracy*100)}%</b> correct vs <b>${Math.round(e.baseline_accuracy*100)}%</b> for a one-pattern baseline; arithmetic problems found correctly on <b>${e.issue_detection}</b> receipts.`});
</script></body></html>
