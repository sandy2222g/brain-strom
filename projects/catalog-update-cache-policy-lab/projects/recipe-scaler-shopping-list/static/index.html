<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cook For N</title>
<style>
:root{--bg:#fdf1f6;--ink:#2b1a26;--mute:#7a5d70;--pop:#b5179e;--pop2:#0b7285;--card:#ffffff;--line:#efd3e3;--chip:#fbe3f0;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1119;--ink:#f7e9f2;--mute:#c0a3b5;--pop:#f06ad0;--pop2:#5fd0e4;--card:#2a1a25;--line:#43283a;--chip:#3a2232;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1119;--ink:#f7e9f2;--mute:#c0a3b5;--pop:#f06ad0;--pop2:#5fd0e4;--card:#2a1a25;--line:#43283a;--chip:#3a2232;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.5 "Gill Sans","Gill Sans MT",Calibri,sans-serif}
main{max-width:940px;margin:auto;padding:26px 16px 56px}
h1{margin:0;font-size:clamp(2rem,6vw,3rem);line-height:1;font-weight:700;letter-spacing:-.01em}
h1 span{color:var(--pop)}
.sub{color:var(--mute);margin:8px 0 18px}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pick label{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--chip);cursor:pointer;transition:background 150ms}
.pick label:has(input:checked){background:var(--pop);color:#fff}
.pick label:has(input:focus-visible){outline:3px solid var(--pop2);outline-offset:2px}
input[type=checkbox]{accent-color:var(--pop);width:18px;height:18px}
.n{display:flex;align-items:center;gap:14px;margin-bottom:22px}
input[type=range]{flex:1;max-width:360px;accent-color:var(--pop)}
.num{font-size:2.2rem;font-weight:700;min-width:2.5ch;color:var(--pop)}
:focus-visible{outline:3px solid var(--pop2);outline-offset:2px}
.layout{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin:0 0 10px;color:var(--pop2)}
.l{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dotted var(--line);font-size:.97rem}
.l:last-child{border-bottom:0}
.big{font-size:2.8rem;font-weight:700;color:var(--ink);line-height:1.1}
.mute{color:var(--mute);font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<h1>Cook for <span id="hn">4</span></h1><p class="sub">Pick dishes and a headcount. Get a shopping list rounded to real pack sizes.</p>
<div class="pick" id="pick" role="group" aria-label="Dishes"></div>
<div class="n"><input type="range" id="ppl" min="1" max="24" value="4" aria-label="People"><span class="num" id="pn">4</span></div>
<div class="layout"><section class="card" aria-live="polite"><h2>Shopping list</h2><div id="list"></div></section>
<section class="card" aria-live="polite"><h2>Cost</h2><div class="big" id="tot"></div><p class="mute" id="note"></p></section></div></main>
<script>
const $=i=>document.getElementById(i),m=n=>"$"+n.toFixed(2);let names=[];
async function init(){const r=await (await fetch("/recipes")).json();names=r.map(x=>x.name);
$("pick").innerHTML=names.map((n,i)=>`<label><input type="checkbox" value="${n}" ${i!=1?"checked":""}>${n}</label>`).join("");
document.querySelectorAll("input[type=checkbox]").forEach(e=>e.onchange=go);$("ppl").oninput=go;go()}
async function go(){const sel=[...document.querySelectorAll("input[type=checkbox]:checked")].map(e=>e.value),p=+$("ppl").value;
$("hn").textContent=$("pn").textContent=p;if(!sel.length){$("list").textContent="Pick a dish.";$("tot").textContent="";$("note").textContent="";return}
const d=await (await fetch("/shop",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({recipes:sel,people:p})})).json();
$("list").innerHTML=d.lines.map(x=>`<div class="l"><span>${x.item} <span class="mute">${x.needed}${x.unit}</span></span><span>${x.packs} pack${x.packs==1?"":"s"} · ${m(x.cost)}</span></div>`).join("");
$("tot").textContent=m(d.total);$("note").textContent=`Shopping for all dishes together costs ${m(d.combined_cost)} vs ${m(d.separate_cost)} shopping each dish separately. Unused leftovers worth ${m(d.waste_value)}.`}
init();
</script></body></html>
