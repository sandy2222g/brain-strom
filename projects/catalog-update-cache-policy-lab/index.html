<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Catalog</title>
<style>
:root{--bg:#0b0c0a;--fg:#e8e8e0;--acid:#d4ff3a;--dim:#7b7f70;--line:#23261d;--panel:#14160f}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f5ee;--fg:#14160f;--acid:#4a6a00;--dim:#60664f;--line:#d8dbcb;--panel:#e9ebdf}}
:root[data-theme="light"]{--bg:#f4f5ee;--fg:#14160f;--acid:#4a6a00;--dim:#60664f;--line:#d8dbcb;--panel:#e9ebdf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Courier New",Consolas,monospace}
main{max-width:1000px;margin:0 auto;padding:28px 16px 60px}
h1{margin:0;font-size:1.6rem;letter-spacing:.08em;text-transform:uppercase}
h1 span{color:var(--acid)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0;padding:10px;background:var(--panel);border:1px solid var(--line)}
.bar input{flex:1 1 220px;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:9px 10px;font:inherit}
.bar input:focus{outline:2px solid var(--acid);outline-offset:1px}
.count{color:var(--dim);white-space:nowrap}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line)}
.idx{color:var(--dim);text-align:right}
.name{color:var(--acid);font-weight:bold;word-break:break-word}
.prob{color:var(--fg);opacity:.85;margin-top:2px}
.tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--line);color:var(--dim);padding:0 6px;font-size:12px}
.open{align-self:start;color:var(--bg);background:var(--acid);text-decoration:none;padding:6px 10px;font-weight:bold;white-space:nowrap}
.open:hover{opacity:.85}
@media (max-width:560px){
  .row{grid-template-columns:1fr;gap:6px}
  .idx{text-align:left}
  .open{justify-self:start}
}
</style></head><body><main>
<h1>Project <span>/</span> Catalog</h1>
<p style="color:var(--dim);margin:8px 0 0">Small demo projects. Each opens on its own GitHub branch.</p>
<div class="bar"><input id="q" type="search" placeholder="filter by name, problem or tag" aria-label="filter"><span class="count" id="count"></span></div>
<div id="list"></div>
</main>
<script>
const DATA = [{"name": "ab-test-judge", "problem": "Teams ship changes because \"B converted better\", often on noise. Reliable decisions need a significance test, a planned sample size, and discipline about peeking.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/ab-test-judge"}, {"name": "appliance-power-cost", "problem": "Electricity with peak and off-peak rates makes \"what does this appliance cost me?\" hard to answer, and a single flat-rate estimate hides when you could save.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/appliance-power-cost"}, {"name": "autocomplete-trie-search", "problem": "Search boxes that only match exact prefixes fail the moment someone mistypes: \"Londno\" returns nothing.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/autocomplete-trie-search"}, {"name": "bag-weight-balancer", "problem": "Two people travelling with two bags want the weights to match, and neither bag over the airline limit. Packing \"one for you, one for me\" in list order rarely achieves that.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/bag-weight-balancer"}, {"name": "bake-sale-pricer", "problem": "You sell brownies, loaves and cupcakes and have tried different prices. What should each cost to make the most profit?", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/bake-sale-pricer"}, {"name": "bill-timing-planner", "problem": "Income and bills arrive on different days, so a month can look fine in total yet overdraw the account for days: the rent is due on the 1st and payday is on the 5th.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/bill-timing-planner"}, {"name": "birthday-countdown", "problem": "A January-to-December birthday list does not tell you who is next. Leap-day birthdays and the year-end rollover make hand counting error-prone.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/birthday-countdown"}, {"name": "bloom-spellcheck", "problem": "A spell checker needs to ask \"is this a word?\" millions of times a second, and storing the whole dictionary (every word as a string) is large when the checker lives in a browser, a phone or a cache in front of a service.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/bloom-spellcheck"}, {"name": "board-game-dice-odds", "problem": "\"Is rolling with advantage really that much better?\" and \"how likely is 28 damage from 8d6?\" are everyday tabletop questions, usually answered by guesswork or by simulations that are slightly different every time.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/board-game-dice-odds"}, {"name": "book-club-picker", "problem": "\"Everyone vote for one book\" lets a polarising title win with 3 of 9 votes while most of the club ranks it last. In the sample, \"The Quiet Orchard\" leads plurality yet 6 of 9 members prefer \"A Map of Small Rooms\" to it.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/book-club-picker"}, {"name": "bookshelf-filler", "problem": "Books in a series must stay in order, but shelf height is wasted when one tall book sits among short ones. Filling each shelf until it is full is quick but not frugal.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/bookshelf-filler"}, {"name": "cache-policy-lab", "problem": "Every cache must decide what to evict. Which policy is best depends on the access pattern, and it is hard to know how much better you could do.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/cache-policy-lab"}, {"name": "cafe-demand-forecaster", "problem": "A small cafe bakes pastries every morning. Too few means lost sales, too many means waste. Weekends are much busier than weekdays, and sales drift upward, so \"same as yesterday\" is wrong.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/cafe-demand-forecaster"}, {"name": "campus-faq-search", "problem": "Students ask the same questions in different words (\"extend my book loan\" vs \"renew a library book\"). Keyword lookup misses them and a chatbot is overkill.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/campus-faq-search"}, {"name": "carry-on-capsule", "problem": "A carry-on has a weight allowance and you own far more clothes than fit. Which pieces give the most outfits?", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/carry-on-capsule"}, {"name": "cellular-automata-lab", "problem": "Cellular automata are a classic way to show how simple local rules create complex behaviour, but most demos show one rule and never check anything.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/cellular-automata-lab"}, {"name": "chase-win-estimator", "problem": "In a limited-overs cricket chase, \"required rate 9.5, current rate 7.7\" only says *behind*. It ignores wickets in hand and does not say how likely a win actually is.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/chase-win-estimator"}, {"name": "check-digit-validator", "problem": "Card numbers, ISBNs, product barcodes and bank account numbers (IBANs) end in a \"check digit\" computed from all the others, so a mistyped number is rejected before it causes a failed payment or a wrong delivery. But no c…", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/check-digit-validator"}, {"name": "checkout-line-chooser", "problem": "At the supermarket the shortest queue is not always the fastest: a short line of full trolleys loses to a longer line of small baskets, and the express lane is closed to big baskets.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/checkout-line-chooser"}, {"name": "chore-rota-planner", "problem": "Housemates rotate chores in a fixed cycle. It is \"fair\" on paper, but it ignores that one person hates the bathroom and another does not mind it, and that chores differ in effort.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/chore-rota-planner"}, {"name": "cinema-seat-picker", "problem": "Booking for a group means finding several free seats side by side in a good spot, and \"first free\" tends to put you in the front corner.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/cinema-seat-picker"}, {"name": "clinic-noshow-predictor", "problem": "Missed appointments waste clinician time and delay care for other patients; typical outpatient no-show rates are 15–30%. Clinics usually either ignore the problem or overbook blindly.", "tags": ["fastapi", "uvicorn", "pandas", "numpy"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/clinic-noshow-predictor"}, {"name": "coin-change-maker", "problem": "A machine with a limited stock of coins must hand back change. Always giving the biggest coin first uses more coins than needed, and can even fail when exact change exists.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/coin-change-maker"}, {"name": "commute-leave-time", "problem": "\"It usually takes 35 minutes\" is the average, so you are late about half the days. A flat buffer ignores that rush hour is slower than early morning and that you may want 95% certainty for an important meeting.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/commute-leave-time"}, {"name": "contact-dedupe", "problem": "Phone and email imports leave several records per person. Exact matching misses \"Kenij Khan\" and \"(902) 048 6495\"; naive fuzzy matching merges different people who share a surname.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/contact-dedupe"}, {"name": "countdown-solver", "problem": "Finding a route to the target by hand is slow, and when none exists you want the closest answer plus proof the search was complete.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/countdown-solver"}, {"name": "coupon-stack-chooser", "problem": "Checkout pages accept several coupons, but only some combine: groups are exclusive, minimum spends apply, and percentage caps change the order of value. Most people just pick the biggest percentage.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/coupon-stack-chooser"}, {"name": "cron-explainer", "problem": "`*/15 9-17 * * 1-5` is a schedule almost nobody can read at a glance, and cron fails silently: a wrong field means a job that runs at 3 a.m. on the wrong day or never runs at all.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/cron-explainer"}, {"name": "day-timebox-planner", "problem": "To-do lists ignore the clock. Working down a list in the order written wastes the small gaps between meetings on low-value chores and leaves the important, deadline-bound tasks without room.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/day-timebox-planner"}, {"name": "debt-payoff-strategist", "problem": "With several debts and one monthly budget, which should you pay first? People guess and overpay interest.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/debt-payoff-strategist"}, {"name": "digit-sketchpad", "problem": "Handwritten-digit recognition is the classic first ML task, but most demos stop at a notebook accuracy number. This one serves the model behind an API and a drawing UI, and measures the thing that breaks real drawing: wh…", "tags": ["fastapi", "uvicorn", "numpy", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/digit-sketchpad"}, {"name": "dinner-sync-planner", "problem": "Cooking a roast with five dishes, one oven and one pair of hands: when do you start each step so everything is ready together?", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/dinner-sync-planner"}, {"name": "dither-lab", "problem": "Printers, e-ink screens, old game consoles and thermal receipt printers can only show black or white. Rounding every pixel to the nearest one throws away all the shading. How do you make a two-colour picture that still *…", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/dither-lab"}, {"name": "elevator-dispatch-sim", "problem": "In a busy building, which lift-dispatch rule gets people moving fastest? Intuition (\"serve whoever pressed first\") turns out to be the worst for waiting time.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/elevator-dispatch-sim"}, {"name": "elo-rating-league", "problem": "A club (table tennis, chess, darts) wants a ranking, but not everyone plays everyone. Ranking by win rate rewards beating weak opponents and punishes playing strong ones, so the league table misleads whenever the schedul…", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/elo-rating-league"}, {"name": "exam-runway", "problem": "Students cram. The night before feels productive, but recall fades within days. Spaced repetition fixes that, yet most planners just split hours evenly across topics and ignore how memory works.", "tags": ["fastapi", "uvicorn", "pandas", "numpy"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/exam-runway"}, {"name": "fair-meeting-time", "problem": "", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/fair-meeting-time"}, {"name": "fair-shift-roster", "problem": "", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/fair-shift-roster"}, {"name": "fair-teams-picker", "problem": "Picking sides for five-a-side by taking turns, best player first, tends to leave one team stronger, and it ignores \"these two always argue\" or \"these two come as a pair\".", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/fair-teams-picker"}, {"name": "final-grade-needed", "problem": "Students know their scores so far but not what the final exam must be worth for an A or a B, especially with weighted categories and \"drop the lowest quiz\" rules.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/final-grade-needed"}, {"name": "flashcard-review-scheduler", "problem": "Students cram flashcards on a fixed rhythm and forget most of them, or review everything daily and burn hours. Which schedule keeps a deck remembered for e": "gradient-descent-lab", "problem": "Almost every machine-learning model is trained by gradient descent, yet two settings, the learning rate and whether the inputs are scaled, decide whether training works, crawls or blows up. Tutorials say so; few let you …", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/gradient-descent-lab"}, {"name": "grocery-aisle-route", "problem": "People shop in the order they wrote the list and zig-zag between aisles and the back wall. In a shop where you can only walk along aisles and two corridors, a good visiting order can cut the walk sharply.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/grocery-aisle-route"}, {"name": "gym-week-planner", "problem": "Home lifters pile exercises into whichever day is free and end up hitting chest or back on consecutive days, or run past their time budget.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/gym-week-planner"}, {"name": "habit-streak-keeper", "problem": "Streak counters that reset to zero after one missed day punish people for a single slip, and discourage a good habit.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/habit-streak-keeper"}, {"name": "hall-booking-optimizer", "problem": "A village hall gets overlapping requests for one Saturday. Accepting them in the order they arrive, or taking as many as possible, can leave a lot of money on the table when one big booking blocks several small ones.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/hall-booking-optimizer"}, {"name": "hash-table-lab", "problem": "Interviews and textbooks say \"linear probing degrades near full\", but by how much, and how does it compare with chaining or double hashing?", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/hash-table-lab"}, {"name": "heating-schedule-optimizer", "problem": "A normal thermostat holds one temperature all day: it heats at expensive peak hours, cannot pre-heat for the morning, and overshoots when nobody cares. With time-of-use power prices, when you heat matters as much as how …", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/heating-schedule-optimizer"}, {"name": "hike-time-estimator", "problem": "Planning a hike by distance alone makes steep routes take far longer than expected, and people end up descending in the dark.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/hike-time-estimator"}, {"name": "home-energy-anomaly", "problem": "Meters show totals, not \"this hour is wrong\". Faults like an oven left on or a heater stuck on are invisible in a monthly bill until it is too late, and a single flat threshold either misses them or alarms constantly bec…", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/home-energy-anomaly"}, {"name": "homework-order-planner", "problem": "With several assignments due at different times, \"do the easy ones first\" or \"do them in the order I wrote them down\" can leave you missing deadlines you could have made.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/homework-order-planner"}, {"name": "household-carbon-coach", "problem": "", "tags": ["fastapi", "uvicorn", "pandas", "numpy"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/household-carbon-coach"}, {"name": "huffman-squeeze", "problem": "\"Compression\" is often a black box. Where does Huffman coding save space, how close is it to the theoretical limit, and where does it lose?", al league needs a round-robin schedule where every team plays every other once. Done carelessly, one team is always at home and another never is, or a team plays three home games in a row.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/league-fixture-planner"}, {"name": "lost-and-found-matcher", "problem": "", "tags": ["fastapi", "uvicorn", "pandas", "numpy"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/lost-and-found-matcher"}, {"name": "machine-anomaly-monitor", "problem": "", "tags": [], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/machine-anomaly-monitor"}, {"name": "markov-name-maker", "problem": "Writers, game designers and map makers need believable place names, and lists of random syllables sound wrong. How do you make names that *sound* English without copying real ones?", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/markov-name-maker"}, {"name": "maze-lab", "problem": "Maze demos usually show one algorithm. Which generator makes harder mazes, and which solver wastes the least effort?", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/maze-lab"}, {"name": "meal-prep-budget-mixer", "problem": "Eating on a budget: you need enough calories and protein, and the cheapest calories (rice, oats) are low in protein. What is the cheapest daily set of servings that still hits both?", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/meal-prep-budget-mixer"}, {"name": "meeting-notes-summarizer", "problem": "Meeting notes pile up unread. People want the three sentences that matter and a list of who promised what by when.", "tags": ["fastapi", "uvicorn", "httpx"], "url": "https://github.com/sandy2222g/brain-strom/tree/catalog/projects/meeting-notes-summarizer const q = document.getElementById("q");
const list = document.getElementById("list");
const count = document.getElementById("count");
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
  const f = q.value.trim().toLowerCase();
  const rows = DATA.filter(p => !f || (p.name + " " + p.problem + " " + p.tags.join(" ")).toLowerCase().includes(f));
  count.textContent = rows.length + " of " + DATA.length;
  list.innerHTML = rows.map((p, i) => `
    <div class="row">
      <div class="idx">${String(i + 1).padStart(3, "0")}</div>
      <div>
        <div class="name">${esc(p.name)}</div>
        <div class="prob">${esc(p.problem || "No problem statement in README.")}</div>
        <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      </div>
      <a class="open" href="${esc(p.url)}" target="_blank" rel="noopener">Open</a>
    </div>`).join("");
}
q.addEventListener("input", render);
render();
