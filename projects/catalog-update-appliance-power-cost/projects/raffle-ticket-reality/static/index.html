<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raffle Ticket Reality Check</title>
<style>
:root{--bg:#f7f7f5;--card:#ffffff;--ink:#1a1a1a;--gold:#c99a06;--gold-ink:#7a5c00;--loss:#b42318;--gain:#027a48;--mute:#6b6b66;--line:#dcdcd6;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1d1d1c;--ink:#f2f2ee;--gold:#f0c24a;--gold-ink:#f5d46e;--loss:#ff8a80;--gain:#6ee7a6;--mute:#a3a39c;--line:#333330;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--card:#1d1d1c;--ink:#f2f2ee;--gold:#f0c24a;--gold-ink:#f5d46e;--loss:#ff8a80;--gain:#6ee7a6;--mute:#a3a39c;--line:#333330;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;padding:24px 16px 48px}
main{max-width:940px;margin:0 auto}
.band{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--gold);color:#1a1400;padding:18px 22px;border-radius:6px;margin-bottom:18px}
.band h1{font:700 26px "Franklin Gothic Medium","Arial Narrow",sans-serif;margin:0;letter-spacing:.02em}
.band p{margin:2px 0 0;font-size:15px;opacity:.85}
.band b{font:700 15px "Franklin Gothic Medium",sans-serif;background:#1a1400;color:var(--gold);padding:8px 14px;border-radius:4px;letter-spacing:.05em}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end}
label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:4px}
select,input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.g{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
h2{font:700 13px "Franklin Gothic Medium",sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--gold-ink);margin:0 0 10px}
.big b{display:block;font:700 42px "Franklin Gothic Medium","Arial Narrow",sans-serif;color:var(--ink);line-height:1.05}
.big span{display:block;color:var(--mute);font-size:14px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
td:first-child,th:first-child{text-align:left}
svg{width:100%;height:170px;display:block}
rect.loss{fill:var(--loss)}rect.gain{fill:var(--gain)}
.m{font-size:13px;color:var(--mute)}
#ro b{color:var(--gold-ink)}
</style></head><body><main>
<header class="band"><div><h1>Ticket reality check</h1><p>What does a decade of weekly tickets actually do to your wallet?</p></div><b id="cost"></b></header>
<div class="row"><div><label for="g">Game</label><select id="g"></select></div><div><label for="t">Tickets bought</label><input id="t" type="number" min="1" max="2000" value="520" style="width:110px"></div></div>
<div class="g"><div class="card big" id="k1"></div><div class="card big" id="k2"></div></div>
<div class="g"><div class="card"><h2>Chance of each prize</h2><table id="tb"></table></div><div class="card"><h2>1,000 imaginary players: final winnings</h2><svg id="sv" viewBox="0 0 400 170" preserveAspectRatio="none"></svg><div class="m" id="sm"></div></div></div>
<div class="card"><h2>Raffle: is my ticket worth it?</h2><div class="row"><div><label for="rs">Tickets sold</label><input id="rs" type="number" value="500" style="width:100px"></div><div><label for="rm">Mine</label><input id="rm" type="number" value="10" style="width:80px"></div><div><label for="rp">Prize $</label><input id="rp" type="number" value="200" style="width:90px"></div><div><label for="rc">Price each $</label><input id="rc" type="number" value="2" style="width:90px"></div></div><div id="ro" class="m"></div></div>
</main><script>
const $=i=>document.getElementById(i);const f=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString();let tm;
async function go(){const r=await fetch(`/analyse?game=${$('g').value}&tickets=${$('t').value}`);const j=await r.json();if(!r.ok)return;
const s=j.sim,e=j.ev;$('cost').textContent='SPENT '+f(s.spent);
$('k1').innerHTML=`<b>${(s.share_ahead*100).toFixed(1)}%</b><span>of players ended up ahead</span>`;
$('k2').innerHTML=`<b>${Math.round(e.payout_rate*100)}¢</b><span>paid back per $1 spent; typical player lost ${f(-s.median_net)}</span>`;
$('tb').innerHTML='<tr><th>Matches</th><th>Prize</th><th>Odds</th></tr>'+j.tiers.filter(t=>t.prize>0).map(t=>`<tr><td>${t.matches}</td><td>${f(t.prize)}</td><td>1 in ${Math.round(t.one_in).toLocaleString()}</td></tr>`).join('');
const mx=Math.max(...s.hist.map(h=>h.count)),w=400/s.hist.length;
$('sv').innerHTML=s.hist.map((h,i)=>`<rect class="${h.to<=0?'loss':'gain'}" x="${i*w+1}" y="${160-h.count/mx*150}" width="${w-2}" height="${h.count/mx*150}"><title>${f(h.from)} to ${f(h.to)}: ${h.count} players</title></rect>`).join('')+`<text x="2" y="168" font-size="10" style="fill:var(--mute)">${f(s.worst)}</text><text x="398" y="168" font-size="10" style="fill:var(--mute)" text-anchor="end">${f(s.best)}</text>`;
$('sm').textContent=`Red = lost money. Best player: ${f(s.best)}. Jackpots hit across all players: ${s.jackpots}.`}
async function raf(){const q=new URLSearchParams({tickets_sold:$('rs').value,mine:$('rm').value,prize:$('rp').value,price:$('rc').value});const r=await fetch('/raffle?'+q);const j=await r.json();
$('ro').innerHTML=r.ok?`You win <b>${(j.p_win*100).toFixed(1)}%</b> of the time. Expected prize ${f(j.expected_prize)} for a cost of ${f(j.cost)}: net <b>${f(j.net)}</b> on average. Break-even prize: ${f(j.break_even_prize)}.`:j.detail}
fetch('/games').then(r=>r.json()).then(d=>{$('g').innerHTML=d.games.map((n,i)=>`<option value="${i}">${n}</option>`).join('');go()});
['g','t'].forEach(i=>$(i).oninput=()=>{clearTimeout(tm);tm=setTimeout(go,250)});['rs','rm','rp','rc'].forEach(i=>$(i).oninput=raf);raf();
</script></body></html>
