<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birthday Countdown</title>
<style>
:root{--paper:#f5efe3;--ink:#201c17;--rust:#b4441f;--card:#fffaf1;--mute:#7a6e5f;--line:#e2d6c0;--onrust:#fff8ee}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#171411;--ink:#f1e9da;--rust:#e0744e;--card:#221e19;--mute:#a39680;--line:#3a3129;--onrust:#1a120d}}
:root[data-theme="dark"]{--paper:#171411;--ink:#f1e9da;--rust:#e0744e;--card:#221e19;--mute:#a39680;--line:#3a3129;--onrust:#1a120d}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 Georgia,"Times New Roman",serif}
main{max-width:760px;margin:0 auto;padding:40px 16px 56px}
header{border-bottom:3px double var(--ink);padding-bottom:14px;margin-bottom:18px}
h1{margin:0;font-size:2.4rem;font-weight:normal;letter-spacing:-.01em}
h1 em{color:var(--rust)}
#sub{margin:8px 0 0;color:var(--mute);font-style:italic}
#out{display:flex;flex-direction:column;gap:0}
.row{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:16px;padding:14px 4px;border-bottom:1px solid var(--line)}
.days{font-size:2.2rem;line-height:1;color:var(--rust);text-align:center;font-variant-numeric:lining-nums}
.days small{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.nm{font-size:1.25rem}
.meta{font-size:.9rem;color:var(--mute);text-align:right;line-height:1.35}
.row.today{background:var(--rust);color:var(--onrust);border-radius:6px;border-bottom:none;margin:6px 0}
.row.today .days,.row.today .meta,.row.today .days small{color:var(--onrust)}
@media (max-width:480px){
  .row{grid-template-columns:72px 1fr;gap:10px}
  .meta{grid-column:2;text-align:left}
  .days{font-size:1.8rem}
}
</style></head><body><main>
<header><h1>Birthday <em>countdown</em></h1><p id="sub"></p></header>
<div id="out"></div></main>
<script>
(async()=>{
  const s=await (await fetch("/sample")).json();
  const r=await (await fetch("/upcoming",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(s)})).json();
  document.getElementById("sub").textContent=`Today is ${s.today}. Soonest first (a January-to-December list would start with ${r.calendar_order[0]}).`;
  document.getElementById("out").innerHTML=r.rows.map(x=>`<div class="row ${x.days===0?"today":""}"><div class="days">${x.days===0?"Today":x.days}<small>${x.days===0?"":"days"}</small></div><div class="nm">${x.name}</div><div class="meta">turns ${x.turning}<br>${x.date}</div></div>`).join("");
})();
</script></body></html>
